<!doctype html>
<html lang="zh-Hant-TW" data-type="software" data-radius="sharp" data-buttons="solid" data-motion="quiet">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Vibe Coding 課堂搶答系統</title>
  <meta name="description" content="老師匯入 Google 試算表學習單，學生分組搶答，結果寫回原學習單。">
  <meta name="page-type" content="software">
  <meta name="site-kind" content="software">
  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/app.css">
</head>
<body class="home">
  <!-- 006 首頁（spec US5；FR-021）。主視覺為課堂搶答情境插圖。 -->
  <main class="home-main">
    <section class="home-intro" data-enter>
      <p class="home-kicker"><span class="home-kicker-dot"></span> NCU · SE6005</p>
      <h1>課堂搶答<br><em>學習單</em></h1>
      <p class="home-lead">老師匯入 Google 試算表，學生分組搶答；答案、順位與成果會寫回原學習單。</p>
      <nav class="home-roles" aria-label="選擇身分">
        <a id="role-teacher" class="home-role home-role--teacher" href="teacher.html">
          <span class="home-role-title">我是老師</span>
          <span class="home-role-desc">建立活動、匯入學習單、開輪與判錯</span>
        </a>
        <a id="role-student" class="home-role" href="student.html">
          <span class="home-role-title">我是學生</span>
          <span class="home-role-desc">輸入活動代碼與組號，加入搶答</span>
        </a>
      </nav>
    </section>
    <figure class="home-hero" data-enter>
      <img src="img/hero-classroom.webp" alt="學生在課堂中舉手搶答，投影幕顯示題目，旁邊有計時器">
      <svg class="home-hero-mark" aria-hidden="true" viewBox="0 0 400 260"><use href="img/illustrations.svg#hero-placeholder"></use></svg>
    </figure>
  </main>
</body>
</html>
