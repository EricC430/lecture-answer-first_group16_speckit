<!doctype html>
<html lang="zh-Hant-TW">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>投影｜Vibe Coding 課堂搶答系統</title>
  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/app.css">
  <link rel="stylesheet" href="css/projection.css">
</head>
<body class="projection">
  <!-- 006 唯讀投影畫面（spec US7）：沒有任何操作元件；只顯示 js/projection-view.js 白名單輸出的公開資訊。 -->
  <div id="sync-banner" role="status" hidden></div>
  <main id="projection-root" aria-live="polite">
    <header class="projection-header">
      <p class="projection-brand">Vibe Coding 課堂搶答</p>
      <p id="projection-stage" class="projection-stage"></p>
    </header>
    <section class="projection-hero">
      <p class="projection-label" id="projection-code-label">活動代碼</p>
      <p id="projection-code" class="projection-code" aria-labelledby="projection-code-label"></p>
      <p id="projection-hint" class="projection-hint"></p>
    </section>
    <section id="projection-round" class="projection-round" hidden>
      <p id="projection-questions" class="projection-questions"></p>
      <p id="projection-countdown" class="projection-countdown"></p>
    </section>
    <section id="projection-results" class="projection-results" hidden></section>
  </main>
  <div id="sync-status" aria-live="polite"></div>
  <script type="module" src="js/projection.js"></script>
  <script type="module" src="js/feedback.js"></script>
</body>
</html>
