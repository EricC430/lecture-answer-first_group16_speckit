<!doctype html>
<html lang="zh-Hant-TW">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>老師｜Vibe Coding 課堂搶答系統</title>
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <!-- 共用：同步中斷橫幅與右下角狀態列，由 js/sync.js 控制 -->
  <div id="sync-banner" role="status" hidden></div>
  <header>
    <h1>老師頁</h1>
  </header>
  <main id="teacher-main">
    <!--
      擴充約定（docs/DEVELOPMENT.md）：每個子功能只新增一個 <section>，
      id 為 "<能力>-section"，邏輯放在 js/<能力>.js，並在頁尾加一行 <script type="module">。
      例如：<section id="import-section" data-feature="002-guided-notes-import"></section>
    -->
    <!-- ── 子功能區塊開始 ── -->
    <section id="activity-section" data-feature="001-activity-session">
      <h2>活動</h2>
      <p id="activity-error" class="error-message" role="alert" hidden></p>
      <div id="activity-create">
        <button type="button" id="create-activity">建立活動</button>
      </div>
      <div id="activity-info" hidden>
        <p>活動代碼：<strong id="activity-code" class="activity-code"></strong></p>
        <p>目前階段：<strong id="activity-stage"></strong>
          <span id="activity-round" class="muted"></span></p>
        <p>題目：<span id="activity-questions" class="muted"></span></p>
        <button type="button" id="dev-seed" hidden>放入假題目（開發用）</button>
        <p id="round-status" hidden>本輪題目：<span id="round-questions"></span>
          <span id="round-countdown" class="countdown"></span></p>
        <div class="controls">
          <button type="button" id="close-round" hidden>關輪</button>
          <button type="button" id="finalize-round" hidden>確認定案</button>
          <button type="button" id="end-activity" hidden>結束活動</button>
          <button type="button" id="cancel-activity" hidden>取消活動</button>
        </div>
        <p id="ended-summary" hidden>未成功題：<span id="ended-unsolved"></span></p>
        <p id="cancelled-summary" class="muted" hidden>活動已取消，不提供寫回與 CSV 下載。</p>
      </div>
      <form id="open-round-panel" hidden>
        <h3>開輪</h3>
        <fieldset>
          <legend>本輪題目（預設全選未成功題）</legend>
          <div id="open-round-questions"></div>
        </fieldset>
        <label><input type="checkbox" id="open-round-fair"> 公平模式</label>
        <label>倒數秒數（選填，1～3600）：
          <input type="number" id="open-round-countdown" min="1" max="3600" step="1"></label>
        <button type="submit">開輪</button>
      </form>
    </section>
    <!-- ── 子功能區塊結束 ── -->
  </main>
  <div id="sync-status" aria-live="polite"></div>
  <!-- ── 子功能 script 開始（每個子功能一行）── -->
  <script type="module" src="js/teacher.js"></script>
  <!-- ── 子功能 script 結束 ── -->
</body>
</html>
